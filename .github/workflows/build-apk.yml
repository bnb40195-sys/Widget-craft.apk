name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish APK to GitHub Releases'
        required: false
        type: boolean
        default: true
      custom_tag:
        description: 'Release Tag (leave empty for automatic timestamp tag)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Prepare Keystore & Environment Secrets
        run: |
          echo "Setting up environment configuration..."
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Grant Execute Permission for Gradle
        run: |
          chmod +x gradlew 2>/dev/null || true

      - name: Build Debug APK
        run: |
          echo "Starting Gradle debug build..."
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Prepare APK Output File
        id: prepare_apk
        run: |
          mkdir -p release-artifacts
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: Debug APK not found in app/build/outputs/apk/debug/"
            exit 1
          fi

          VERSION_NAME="1.0"
          COMMIT_SHA_SHORT=$(git rev-parse --short HEAD 2>/dev/null || echo "latest")
          OUTPUT_APK="release-artifacts/WidgetCraft-debug-${COMMIT_SHA_SHORT}.apk"
          LATEST_APK="release-artifacts/WidgetCraft-debug.apk"

          cp "$APK_PATH" "$OUTPUT_APK"
          cp "$APK_PATH" "$LATEST_APK"
          APK_SIZE=$(du -h "$LATEST_APK" | cut -f1)

          echo "apk_path=$LATEST_APK" >> $GITHUB_OUTPUT
          echo "apk_named_path=$OUTPUT_APK" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA_SHORT" >> $GITHUB_OUTPUT

          echo "APK generated successfully: $LATEST_APK ($APK_SIZE)"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WidgetCraft-Debug-APK
          path: release-artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Determine Release Tag
        id: release_tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          if [ -n "${{ github.event.inputs.custom_tag }}" ]; then
            TAG="${{ github.event.inputs.custom_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')
            TAG="v1.0-${TIMESTAMP}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish Direct APK Download to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release != 'false') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "WidgetCraft Pro ${{ steps.release_tag.outputs.tag }}"
          draft: false
          prerelease: false
          files: |
            ${{ steps.prepare_apk.outputs.apk_path }}
            ${{ steps.prepare_apk.outputs.apk_named_path }}
          body: |
            ### 📱 WidgetCraft Pro - Android Debug APK (${{ steps.release_tag.outputs.tag }})

            Direct downloadable APK built automatically by GitHub Actions from Google AI Studio.

            #### 📥 Direct APK Download:
            - **[Download WidgetCraft-debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_tag.outputs.tag }}/WidgetCraft-debug.apk)** (Size: ${{ steps.prepare_apk.outputs.apk_size }})
            - **Commit**: `${{ steps.prepare_apk.outputs.commit_sha }}`

            ---
            #### ✨ Key Features in this Build:
            1. **100% Offline Functionality (بدون إنترنت)**: All widgets, custom keyboard themes, and wallpapers work locally without cloud dependency.
            2. **AI Image-to-Keyboard Studio (لوحة المفاتيح التفاعلية)**:
               - Upload any image to analyze palette and luminance.
               - On-device AI generates matching high-contrast keyboard themes.
               - Full interactive keyboard test pad (Arabic & English layouts, numbers row, haptic feedback, live typing).
            3. **AI Wallpaper Generator (الخلفيات الذكية)**:
               - Analyzes image brightness to calculate optimal dimming and contrast so home screen widgets remain crisp.
            4. **Notification Center App Shortcuts (إختصارات مركز الإشعارات)**:
               - Persistent quick launch action buttons (Phone, Camera, Messages, Browser, Notes) directly in the Android notification shade.
               - Interactive switch to turn notification shortcuts on/off and pin/unpin favourite apps.
            5. **Islamic & Halal Filtered (مفلتر بالكامل)**:
               - Zero depictions of living beings, animals, or women (pure geometric, landscape, typography, neon, and minimal designs).
            6. **Online Store Removed**:
               - Completely replaced with the offline AI Keyboard & Wallpaper Studio.

            ---
            *Built with Kotlin, Jetpack Compose, and GitHub Actions.*

      - name: Generate Job Summary
        run: |
          echo "## 🚀 Android Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **APK File**: \`${{ steps.prepare_apk.outputs.apk_path }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **File Size**: ${{ steps.prepare_apk.outputs.apk_size }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ steps.prepare_apk.outputs.commit_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 How to Download:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to the **Releases** tab on your GitHub repository to download **WidgetCraft-debug.apk** directly to your phone." >> $GITHUB_STEP_SUMMARY
          echo "2. Or download the build artifact **WidgetCraft-Debug-APK** from the bottom of this Action run page." >> $GITHUB_STEP_SUMMARY
